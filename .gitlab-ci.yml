---

image:
  name: maven:3.9-eclipse-temurin-25

variables:
  MAVEN_OPTS: "-Xmx256m"
  SONAR_EXCLUSIONS: "**/*.png,**/*.jpg,**/*.ico,**/*.ttf,**/*.xlsx,**/*.zip,**/*.woff2"

stages:
  - build
  - deploy
  - analyze

maven-build:
  stage: build
  environment: staging
  script:
    - "mvn spotless:check"
    - "mvn -U package"
  tags:
    - docker
  artifacts:
    when: always
    paths:
      - "**/target/surefire-reports/TEST-*.xml"
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"

maven-deploy:
  stage: deploy
  environment: staging
  script:
    - "mvn -U deploy -DperformRelease -DskipTests"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH =~ /^ft-.*-deploy$/
    - if: $CI_COMMIT_BRANCH =~ /^hf-.*$/
  tags:
    - docker

sonar-old-analyze:
  needs: []
  stage: analyze
  environment: staging
  script:
    - mvn -U verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
      -Dsonar.projectBranch=${CI_COMMIT_BRANCH}
      -DskipTests
      -Dsonar.host.url="https://sonar.tools.kobalt.fr"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  tags:
    - docker

sonar-analyze:
  needs: []
  stage: analyze
  environment: staging
  script:
    - mvn -U verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
      -Dsonar.projectBranch=${CI_COMMIT_BRANCH}
      -DskipTests
      -Dsonar.host.url="https://sonar2.tools.kobalt.fr"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.exclusions="$SONAR_EXCLUSIONS"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  variables:
    # get rid of sonar Shallow clone detected... warning
    GIT_DEPTH: 0
  tags:
    - docker
